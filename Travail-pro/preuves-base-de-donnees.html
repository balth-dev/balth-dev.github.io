<dialog class="evidence-dialog" aria-label="Capture agrandie">
    <form method="dialog">
        <button class="evidence-dialog-close" aria-label="Fermer la capture">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </form>
    <img class="evidence-dialog-image" alt="">
</dialog>
<script>
    const evidenceDialog = document.querySelector('.evidence-dialog');
    const enlargedImage = document.querySelector('.evidence-dialog-image');
    document.querySelectorAll('.evidence-item img').forEach((image) => {
        const openImage = () => {
            enlargedImage.src = image.src;
            enlargedImage.alt = image.alt;
            evidenceDialog.showModal();
        };

        image.addEventListener('click', openImage);
        image.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openImage();
            }
        });
    });

    evidenceDialog.addEventListener('click', (event) => {
        if (event.target === evidenceDialog) {
            evidenceDialog.close();
        }
    });
</script>
